openapi: 3.2.0
info:
  title: Endpoints /extract API
  version: '1.0'
servers:
- url: https://api.contextual.ai/v1
security:
- BearerAuth: []
tags:
- name: /extract
paths:
  /extract/schemas:
    get:
      tags:
      - /extract
      summary: List Schemas
      description: List schemas with optional search.
      operationId: list_schemas_extract_schemas_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - /extract
      summary: Create Schema
      description: 'Create a new extraction schema.


        Creates a JSON Schema that defines the structure of data to extract from documents. The schema must conform to our supported subset of JSON Schema 2020-12 features.


        Supported Schema Features:


        Basic Types:


        1. `string`: Text data with optional constraints (`minLength`, `maxLength`, `pattern`, `enum`)

        2. `integer`: Whole numbers with optional constraints (`minimum`, `maximum`, `enum`)

        3. `number`: Decimal numbers with optional constraints (`minimum`, `maximum`, `enum`)

        4. `boolean`: True/false values

        5. `null`: Null values (often used with `anyOf` for optional fields)


        Complex Types:


        1. `object`: Key-value pairs with defined properties

        2. `array`: Lists of items with defined item schemas

        3. `anyOf`: Union types (e.g., string or null for optional fields)


        String Formats:


        Supported formats: `date-time`, `time`, `date`, `duration`, `email`, `hostname`, `ipv4`, `ipv6`, `uuid`, `uri`


        Schema Structure:


        1. Root schema must be an `object` type

        2. Use `$defs` for reusable schema components

        3. Use `$ref` to reference definitions

        4. Arrays must have `items` schema defined


        Constraints:


        1. Maximum 10 leaf nodes per array (prevents overly complex schemas)

        2. No circular references in `$ref` definitions

        3. String formats must be from the supported list


        Example Schemas:


        Simple Company Schema:

        ```json

        {

        "type": "object",

        "properties": {

        "company_name": {

        "type": "string",

        "description": "The name of the company exactly as it appears in the document"

        },

        "form_type": {

        "type": "string",

        "enum": ["10-K", "10-Q", "8-K", "S-1"],

        "description": "The type of SEC form"

        },

        "trading_symbol": {

        "type": "string",

        "description": "The trading symbol of the company"

        },

        "zip_code": {

        "type": "integer",

        "description": "The zip code of the company headquarters"

        }

        },

        "required": ["company_name", "form_type", "trading_symbol", "zip_code"]

        }

        ```


        Complex Resume Schema:

        ```json

        {

        "type": "object",

        "properties": {

        "personalInfo": {

        "type": "object",

        "properties": {

        "fullName": {"type": "string"},

        "contact": {

        "type": "object",

        "properties": {

        "emails": {

        "type": "array",

        "items": {"type": "string", "format": "email"}

        },

        "phones": {

        "type": "array",

        "items": {"type": "string"}

        }

        }

        }

        },

        "required": ["fullName"]

        },

        "workExperience": {

        "type": "array",

        "items": {

        "type": "object",

        "properties": {

        "jobTitle": {"type": "string"},

        "company": {"type": "string"},

        "startDate": {"type": "string"},

        "endDate": {"type": ["string", "null"]},

        "isCurrent": {"type": "boolean"}

        },

        "required": ["jobTitle", "company", "startDate"]

        }

        }

        },

        "required": ["personalInfo", "workExperience"]

        }

        ```


        Schema with References:

        ```json

        {

        "type": "object",

        "properties": {

        "algorithms": {

        "type": "array",

        "items": {"$ref": "#/$defs/algorithm"}

        }

        },

        "$defs": {

        "algorithm": {

        "type": "object",

        "properties": {

        "name": {"type": "string"},

        "description": {"type": "string"}

        },

        "required": ["name"]

        }

        }

        }

        ```


        Best Practices:


        1. Use descriptive field names that clearly indicate what data should be extracted

        2. Add detailed descriptions to help the AI understand what to extract

        3. Use `enum` for known values (e.g., form types, status values)

        4. Make fields optional by using `anyOf` with `null` or omitting from `required`

        5. Use arrays for lists of similar items (e.g., work experience, education)

        6. Keep schemas focused - avoid overly complex nested structures

        7. Test with sample documents to ensure the schema captures the expected data'
      operationId: create_schema_extract_schemas_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaCreateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /extract/schemas/{schema_id}:
    get:
      tags:
      - /extract
      summary: Get Schema
      description: Get schema information by ID.
      operationId: get_schema_extract_schemas__schema_id__get
      parameters:
      - name: schema_id
        in: path
        required: true
        schema:
          type: string
          title: Schema Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - /extract
      summary: Update Schema
      description: Update an existing schema.
      operationId: update_schema_extract_schemas__schema_id__put
      parameters:
      - name: schema_id
        in: path
        required: true
        schema:
          type: string
          title: Schema Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - /extract
      summary: Delete Schema
      description: Delete a schema.
      operationId: delete_schema_extract_schemas__schema_id__delete
      parameters:
      - name: schema_id
        in: path
        required: true
        schema:
          type: string
          title: Schema Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Delete Schema Extract Schemas  Schema Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /extract/documents:
    get:
      tags:
      - /extract
      summary: List Documents
      description: List documents for structured extraction.
      operationId: list_documents_extract_documents_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /extract/documents/upload:
    post:
      tags:
      - /extract
      summary: Upload Document
      description: 'Upload a document for structured extraction.


        Uploads a PDF document that can be used for structured data extraction. Only PDF files are supported.


        Supported File Types:


        1. PDF files only (`.pdf` extension)

        2. Maximum file size: 50MB (recommended)

        3. Documents are processed and validated upon upload


        Document Processing:


        1. File size and page count are automatically calculated

        2. Document is validated for PDF format and readability

        3. Metadata is extracted and stored for future reference

        4. Document is stored securely and can be referenced by ID


        Usage:


        After uploading, you''ll receive a `document_id` that can be used with:


        1. `POST /jobs` endpoint to start extraction jobs

        2. `GET /documents/{document_id}` to retrieve document information

        3. `DELETE /documents/{document_id}` to remove the document


        Example Response:

        ```json

        {

        "document_id": "123e4567-e89b-12d3-a456-426614174000",

        "file_name": "financial_report.pdf",

        "file_size": 2048576,

        "page_count": 45,

        "uploaded_at": "2025-01-11T18:35:00Z",

        "status": "uploaded"

        }

        ```'
      operationId: upload_document_extract_documents_upload_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_extract_documents_upload_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /extract/documents/{document_id}:
    get:
      tags:
      - /extract
      summary: Get Document
      description: Get document information by ID.
      operationId: get_document_extract_documents__document_id__get
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentInfoResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - /extract
      summary: Delete Document
      description: Delete a document.
      operationId: delete_document_extract_documents__document_id__delete
      parameters:
      - name: document_id
        in: path
        required: true
        schema:
          type: string
          title: Document Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Delete Document Extract Documents  Document Id  Delete
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /extract/jobs:
    get:
      tags:
      - /extract
      summary: List Jobs
      description: List extraction jobs.
      operationId: list_jobs_extract_jobs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - name: job_status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Job Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - /extract
      summary: Start Extraction Job
      description: 'Start a new structured extraction job. Extracts structured data from a PDF document using AI models based on a JSON Schema. The `document_id` and `schema_id` must be valid UUIDs of previously uploaded documents and created schemas. How It Works:


        1. Document Processing: The system analyzes the PDF document and splits it into manageable sections

        2. Schema Analysis: Your JSON schema is parsed and validated for supported features

        3. Extraction: The pipeline processes each section and extracts data according to your schema

        4. Validation: Extracted data is validated against your schema to ensure constraints and requirements are met

        5. Results: Structured data is returned in the format defined by your schema


        Supported Models:


        1. `gemini-2.5-flash`: Fast, cost-effective model for most use cases (default)

        2. `gemini-2.5-pro`: More powerful model for complex extractions


        Configuration Options:


        Basic Settings:


        1. `model`: AI model to use for extraction

        2. `max_num_concurrent_requests`: Number of parallel processing requests (1-20)

        3. `validate_response_schema`: Whether to validate extracted data against schema


        Advanced Settings:


        1. `per_key_attribution`: Enable detailed reasoning and confidence scores for each field

        2. `temperature`: Control randomness in AI responses (0.0-2.0)

        3. `seed`: Set random seed for reproducible results

        4. `enable_thinking`: Show AI reasoning process

        5. `n_max_retries`: Maximum retry attempts for failed requests


        Streaming Mode (`stream=true`):


        When `stream=true`, the endpoint returns an SSE stream instead of a job ID. Results are streamed as subtrees complete, enabling real-time progress visibility in the frontend. - Response: SSE stream (`text/event-stream`) with events: `start`, `subtree_result`, `subtree_error`, `agentic_array_progress`

        - Job records are still created and results persisted (retrievable via `GET /jobs/{job_id}`)

        - Always durable: Uses Temporal workflow—job continues running even if client disconnects

        - Automatic retries: Temporal handles activity failures and retries automatically

        - Use case: Interactive frontend UI where users want real-time extraction progress


        SSE Event Types:


        1. `start`: Emitted once with `job_id`, `total_subtrees`, and `start_time`

        2. `subtree_result`: Emitted per successful subtree with `extracted_result`, `attributions`, `usage_metadata`

        3. `subtree_error`: Emitted per failed subtree with `error_message` and `error_type`


        See `STREAMING-DESIGN.md` for full protocol specification. Job Lifecycle:


        1. `pending`: Job is queued and waiting to start

        2. `processing`: AI is actively extracting data from the document

        3. `completed`: Extraction finished successfully with results

        4. `failed`: Extraction failed due to an error

        5. `cancelled`: Job was cancelled before completion


        Monitoring Progress:


        Use the `GET /jobs/{job_id}` endpoint to check job status and progress:


        1. `completion_percentage`: Overall progress (0-100)

        2. `current_step`: Current processing stage

        3. `fields_processed`: Number of schema fields completed

        4. `total_fields`: Total number of schema fields to process


        Getting Results:


        Once a job is completed, use `GET /jobs/{job_id}/results` to retrieve:


        1. `results`: Extracted data conforming to your schema

        2. `metadata`: Processing information, costs, and performance metrics

        3. `attributions`: (if enabled) Reasoning and confidence scores for each field


        Example Request:

        ```json

        {

        "document_id": "123e4567-e89b-12d3-a456-426614174000",

        "schema_id": "987fcdeb-51a2-43d1-b456-426614174000",

        "config": {

        "model": "gemini-2.5-flash",

        "per_key_attribution": true,

        "temperature": 0.1,

        "enable_thinking": true

        "additional_instructions": "Extract information only about company X.'
      operationId: start_extraction_job_extract_jobs_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractJobRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractJobResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /extract/jobs/{job_id}/stream:
    get:
      tags:
      - /extract
      summary: Resume Streaming Extraction
      description: 'Resume streaming events for an existing extraction job.


        This endpoint:

        1. Validates the job exists and is still processing

        2. Queries Temporal workflow for current state (accumulated_results)

        3. Sends current state as initial event

        4. Streams new events going forward'
      operationId: resume_streaming_extraction_extract_jobs__job_id__stream_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /extract/jobs/{job_id}:
    get:
      tags:
      - /extract
      summary: Get Job Status
      description: 'Get the status of an extraction job.


        For running jobs with a Temporal workflow, returns accumulated results and failed subtrees from workflow queries. For completed/failed jobs or jobs without workflow, these fields are empty.'
      operationId: get_job_status_extract_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /extract/jobs/{job_id}/results:
    get:
      tags:
      - /extract
      summary: Get Job Results
      description: Get the results of a completed extraction job.
      operationId: get_job_results_extract_jobs__job_id__results_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResultsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - /extract
      summary: Update Job Results
      description: Update the results of a completed extraction job.
      operationId: update_job_results_extract_jobs__job_id__results_put
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobResultsUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    SchemaResponse:
      properties:
        schema_id:
          type: string
          title: Schema Id
          description: Unique ID of the schema
        name:
          type: string
          title: Name
          description: Name of the schema
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the schema
        schema_definition:
          additionalProperties: true
          type: object
          title: Schema Definition
          description: JSON schema definition
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Schema metadata
        created_at:
          type: string
          title: Created At
          description: Timestamp when the schema was created
        updated_at:
          type: string
          title: Updated At
          description: Timestamp when the schema was last updated
      type: object
      required:
      - schema_id
      - name
      - schema_definition
      - metadata
      - created_at
      - updated_at
      title: SchemaResponse
      description: Response model for schema information.
    ProgressInfo:
      properties:
        completion_percentage:
          type: integer
          maximum: 100
          minimum: 0
          title: Completion Percentage
          description: Overall progress percentage (0-100)
        current_step:
          type: string
          title: Current Step
          description: Current processing stage or step description
        fields_processed:
          type: integer
          minimum: 0
          title: Fields Processed
          description: Number of schema fields that have been processed
          default: 0
        total_fields:
          type: integer
          minimum: 0
          title: Total Fields
          description: Total number of schema fields to process
          default: 0
      type: object
      required:
      - completion_percentage
      - current_step
      title: ProgressInfo
      description: Progress information for an extraction job.
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: Unique ID of the extraction job
        status:
          $ref: '#/components/schemas/DocumentStatusEnum'
          description: Current status of the job
        created_at:
          type: string
          title: Created At
          description: Timestamp when the job was created
        progress:
          $ref: '#/components/schemas/ProgressInfo'
          description: Progress information
        current_activity:
          type: string
          title: Current Activity
          description: Current activity being performed
        schema_id:
          type: string
          title: Schema Id
          description: ID of the schema used for the extraction
        document_id:
          type: string
          title: Document Id
          description: ID of the document used for the extraction
        config:
          anyOf:
          - $ref: '#/components/schemas/ExtractConfig'
          - type: 'null'
          description: Configuration used for the extraction job (model, temperature, etc.)
      type: object
      required:
      - job_id
      - status
      - created_at
      - progress
      - current_activity
      - schema_id
      - document_id
      title: JobStatusResponse
      description: 'Response model for job status.


        Returns basic job status and progress.'
    SchemaListResponse:
      properties:
        schemas:
          items:
            $ref: '#/components/schemas/SchemaResponse'
          type: array
          title: Schemas
          description: List of schemas
        total_count:
          type: integer
          title: Total Count
          description: Total number of schemas
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
          description: Next cursor to continue pagination. Omitted if there are no more schemas to retrieve.
        prev_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Prev Cursor
          description: Previous cursor to go back in pagination. Omitted if this is the first page.
      type: object
      required:
      - schemas
      - total_count
      title: SchemaListResponse
      description: Response model for schema listing.
    SchemaCreateRequest:
      properties:
        name:
          type: string
          title: Name
          description: Name of the schema
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the schema
        schema_definition:
          additionalProperties: true
          type: object
          title: Schema Definition
          description: JSON Schema definition. Must be a valid JSON Schema that defines the structure of data to extract from documents. See the comprehensive schema guide in the API documentation for detailed examples and supported features.
          examples:
          - properties:
              company_name:
                description: The name of the company exactly as it appears in the document
                type: string
              form_type:
                description: The type of SEC form
                enum:
                - 10-K
                - 10-Q
                - 8-K
                - S-1
                type: string
              trading_symbol:
                description: The trading symbol of the company
                type: string
              zip_code:
                description: The zip code of the company headquarters
                type: integer
            required:
            - company_name
            - form_type
            - trading_symbol
            - zip_code
            type: object
        metadata:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Metadata
          description: Additional metadata for the schema
      additionalProperties: false
      type: object
      required:
      - name
      - schema_definition
      title: SchemaCreateRequest
      description: 'Request model for creating a new extraction schema.


